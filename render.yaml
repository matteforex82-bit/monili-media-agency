services:
  - type: web
    name: monili-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: IMAGE_GENERATOR
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_TEXT_MODEL
        value: openai/gpt-4.1-mini
      - key: OPENROUTER_IMAGE_MODEL
        value: google/gemini-3.1-flash-image-preview
      - key: MAX_AI_VISUALS
        value: "1"
      - key: MAX_UPLOAD_BYTES
        value: "26214400"

  - type: web
    name: monili-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NEXT_PUBLIC_API_URL
        value: https://monili-backend.onrender.com
